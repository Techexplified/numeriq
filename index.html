<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Numeriq</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>

<script>
window.TrelloPowerUp.initialize({

  "card-badges": function (t, options) {
    return t.card("labels").then(function(card) {
      const badges = [];

      if (card.labels && card.labels.length > 0) {
        card.labels.forEach(label => {
          
          // Convert to lowercase so "Urgent", "URGENT", and "urgent" all work
          const labelName = label.name.toLowerCase();

          // 1. Critical / Urgent
          if (labelName.includes("urgent") || labelName.includes("critical")) {
            badges.push({ text: "🚨 URGENT", color: "red" });
          } 
          
          // 2. Blocked / Stuck
          else if (labelName.includes("blocked") || labelName.includes("stuck")) {
            badges.push({ text: "🛑 BLOCKED", color: "orange" });
          } 
          
          // 3. In Progress / Doing
          else if (labelName.includes("in progress") || labelName.includes("doing")) {
            badges.push({ text: "⏳ IN PROGRESS", color: "yellow" });
          } 
          
          // 4. Needs Review / QA
          else if (labelName.includes("review") || labelName.includes("qa")) {
            badges.push({ text: "👀 NEEDS REVIEW", color: "purple" });
          } 
          
          // 5. Completed / Done
          else if (labelName.includes("completed") || labelName.includes("done")) {
            badges.push({ text: "✅ COMPLETED", color: "green" });
          } 
          
          // 6. Low Priority / Backlog
          else if (labelName.includes("low priority") || labelName.includes("backlog")) {
            badges.push({ text: "🔽 LOW PRIORITY", color: "sky" });
          }

        });
      }

      return badges;
    });
  }

});
</script>

</body>
</html>
