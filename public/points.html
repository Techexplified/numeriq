<!DOCTYPE html>
<html>
<head>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 10px;
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .point-btn {
      background-color: #f1f2f4;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 15px 0;
      font-size: 18px;
      font-weight: bold;
      color: #172b4d;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .point-btn:hover {
      background-color: #e9eaec;
      border-color: #0c66e4;
      color: #0c66e4;
      transform: translateY(-2px);
    }
    .clear-btn {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background-color: #ffeceb;
      color: #c9372c;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .clear-btn:hover {
      background-color: #fbd6d5;
    }
  </style>
</head>
<body>

  <div class="grid" id="point-container">
    <button class="point-btn" data-val="1">1</button>
    <button class="point-btn" data-val="2">2</button>
    <button class="point-btn" data-val="3">3</button>
    <button class="point-btn" data-val="5">5</button>
    <button class="point-btn" data-val="8">8</button>
    <button class="point-btn" data-val="13">13</button>
    <button class="point-btn" data-val="21">21</button>
    <button class="point-btn" data-val="?">?</button>
  </div>

  <button class="clear-btn" id="clear-btn">Clear Points</button>

  <script>
    const t = window.TrelloPowerUp.iframe();

    // When a number is clicked, save it to Trello and close the popup
    document.getElementById('point-container').addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON') {
        const value = e.target.getAttribute('data-val');
        t.set('card', 'shared', 'storyPoints', value)
         .then(function() {
           t.closePopup();
         });
      }
    });

    // When clear is clicked, remove the data
    document.getElementById('clear-btn').addEventListener('click', function() {
      t.remove('card', 'shared', 'storyPoints')
       .then(function() {
         t.closePopup();
       });
    });
  </script>
</body>
</html>
