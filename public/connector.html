<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Numeriq Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
window.TrelloPowerUp.initialize({

  // 1. BOARD BUTTONS (Stats Modal AND Instant Toggle)
  "board-buttons": function (t) {
    return t.get('board', 'shared', 'showBadges', true).then(function(showBadges) {
      return [
        {
          icon: {
            light: "https://cdn-icons-png.flaticon.com/512/709/709612.png",
            dark: "https://cdn-icons-png.flaticon.com/512/709/709612.png"
          },
          text: "Numeriq Stats",
          callback: function (t) {
            return t.modal({
              title: "Numeriq Board Dashboard",
              url: "./index.html", 
              fullscreen: false 
            });
          }
        },
        {
          icon: "https://cdn-icons-png.flaticon.com/512/5968/5968756.png",
          text: showBadges ? "Hide #s" : "Show #s",
          callback: function (t) {
            return t.set('board', 'shared', 'showBadges', !showBadges);
          }
        }
      ];
    });
  },

  // 2. CARD BADGES (Strictly just the # numbers)
  "card-badges": function (t) {
    return Promise.all([
      t.card("idShort"), // Only asking Trello for the ID number now
      t.get('board', 'shared', 'showBadges', true) 
    ]).then(function([card, showBadges]) {
      
      const badges = [];

      // Add the # number if the toggle is ON
      if (card.idShort && showBadges !== false) {
        badges.push({
          text: "#" + card.idShort,
          color: "blue"
        });
      }
      
      return badges;
    });
  }
});
</script>
</body>
</html>
