<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Numeriq Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
window.TrelloPowerUp.initialize({

  // 1. BOARD BUTTONS (Stats Popup AND Instant Toggle)
  "board-buttons": function (t) {
    return t.get('board', 'shared', 'showBadges', true).then(function(showBadges) {
      return [
        {
          // Button 1: Opens your new Data Table
          icon: {
            light: "https://cdn-icons-png.flaticon.com/512/709/709612.png",
            dark: "https://cdn-icons-png.flaticon.com/512/709/709612.png"
          },
          text: "Numeriq Stats",
          callback: function (t) {
            return t.popup({
              title: "Board Summary",
              url: "./index.html", 
              height: 400 // Made taller to fit the table
            });
          }
        },
        {
          // Button 2: The Instant On/Off Toggle!
          icon: "https://cdn-icons-png.flaticon.com/512/5968/5968756.png",
          text: showBadges ? "Hide #s" : "Show #s",
          callback: function (t) {
            return t.set('board', 'shared', 'showBadges', !showBadges);
          }
        }
      ];
    });
  },

  // 2. CARD BUTTONS (For Story Points)
  "card-buttons": function (t) {
    return [{
      icon: "https://cdn-icons-png.flaticon.com/512/1828/1828859.png", 
      text: "Estimate Points",
      callback: function (t) {
        return t.popup({
          title: "Select Story Points",
          url: "./points.html",
          height: 240
        });
      }
    }];
  },

  // 3. CARD BADGES (Numbers, Points, and Labels)
  "card-badges": function (t) {
    return Promise.all([
      t.get('card', 'shared', 'storyPoints'),
      t.card("idShort", "labels"),
      t.get('board', 'shared', 'showBadges', true) // Check the toggle status
    ]).then(function([points, card, showBadges]) {
      const badges = [];

      // Only add the # number if the toggle is ON
      if (card.idShort && showBadges !== false) {
        badges.push({
          text: "#" + card.idShort,
          color: "blue"
        });
      }

      if (points) {
        badges.push({ 
          text: "🔢 " + points + " Pts", 
          color: "purple" 
        });
      }

      if (card.labels && card.labels.length > 0) {
        card.labels.forEach(label => {
          const labelName = label.name.toLowerCase();
          if (labelName.includes("urgent")) {
            badges.push({ text: "🚨 URGENT", color: "red" });
          } else if (labelName.includes("low priority")) {
            badges.push({ text: "🔽 LOW PRIORITY", color: "sky" });
          }
        });
      }
      
      return badges;
    });
  }
});
</script>
</body>
</html>
