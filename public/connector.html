<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Numeriq Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
window.TrelloPowerUp.initialize({

  "board-buttons": function (t) {
    return t.get('board', 'shared', 'showBadges', true).then(function(showBadges) {
      return [
        {
          icon: {
            light: "https://cdn-icons-png.flaticon.com/512/709/709612.png",
            dark: "https://cdn-icons-png.flaticon.com/512/709/709612.png"
          },
          text: "Numeriq Stats",
          callback: function (t) {
            // NEW: t.modal creates a massive dashboard instead of a tiny popup!
            return t.modal({
              title: "Numeriq Board Dashboard",
              url: "./index.html", 
              fullscreen: false // Setting this to true would make it 100% of the screen!
            });
          }
        },
        {
          icon: "https://cdn-icons-png.flaticon.com/512/5968/5968756.png",
          text: showBadges ? "Hide #s" : "Show #s",
          callback: function (t) {
            return t.set('board', 'shared', 'showBadges', !showBadges);
          }
        }
      ];
    });
  },

  "card-buttons": function (t) {
    return [{
      icon: "https://cdn-icons-png.flaticon.com/512/1828/1828859.png", 
      text: "Estimate Points",
      callback: function (t) {
        return t.popup({ title: "Select Story Points", url: "./points.html", height: 240 });
      }
    }];
  },

  "card-badges": function (t) {
    return Promise.all([
      t.get('card', 'shared', 'storyPoints'),
      t.card("idShort", "labels"),
      t.get('board', 'shared', 'showBadges', true)
    ]).then(function([points, card, showBadges]) {
      const badges = [];
      if (card.idShort && showBadges !== false) badges.push({ text: "#" + card.idShort, color: "blue" });
      if (points) badges.push({ text: "🔢 " + points + " Pts", color: "purple" });
      if (card.labels && card.labels.length > 0) {
        card.labels.forEach(label => {
          const l = label.name.toLowerCase();
          if (l.includes("urgent")) badges.push({ text: "🚨 URGENT", color: "red" });
          else if (l.includes("low priority")) badges.push({ text: "🔽 LOW PRIORITY", color: "sky" });
        });
      }
      return badges;
    });
  }
});
</script>
</body>
</html>
