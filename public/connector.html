<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Numeriq Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
window.TrelloPowerUp.initialize({

  "board-buttons": function (t) {
    return [{
      icon: {
        light: "https://cdn-icons-png.flaticon.com/512/709/709612.png",
        dark: "https://cdn-icons-png.flaticon.com/512/709/709612.png"
      },
      text: "Numeriq",
      callback: function (t) {
        return t.popup({
          title: "Numeriq Stats",
          url: "./index.html", 
          height: 350
        });
      }
    }];
  },

  "card-buttons": function (t) {
    return [{
      icon: "https://cdn-icons-png.flaticon.com/512/1828/1828859.png", 
      text: "Estimate Points",
      callback: function (t) {
        return t.popup({
          title: "Select Story Points",
          url: "./points.html",
          height: 240
        });
      }
    }];
  },

  "card-badges": function (t) {
    // We need to fetch: 
    // 1. storyPoints (our custom data)
    // 2. idShort (the #number)
    // 3. labels (for Urgent/Low Priority)
    return Promise.all([
      t.get('card', 'shared', 'storyPoints'),
      t.card("idShort", "labels")
    ]).then(function([points, card]) {
      const badges = [];

      // 1. ADD THE #NUMBER (Blue Badge)
      if (card.idShort) {
        badges.push({
          text: "#" + card.idShort,
          color: "blue"
        });
      }

      // 2. ADD THE STORY POINTS (Score)
      if (points) {
        badges.push({ 
          text: "🔢 " + points + " Pts", 
          color: "purple" // Purple makes it stand out from the ID
        });
      }

      // 3. ADD THE LABELS (Urgent/Low Priority)
      if (card.labels && card.labels.length > 0) {
        card.labels.forEach(label => {
          const labelName = label.name.toLowerCase();
          if (labelName.includes("urgent")) {
            badges.push({ text: "🚨 URGENT", color: "red" });
          } else if (labelName.includes("low priority")) {
            badges.push({ text: "🔽 LOW PRIORITY", color: "sky" });
          }
        });
      }
      
      return badges;
    });
  }
});
</script>
</body>
</html>
